# Geçici tanı: GitHub Models uç noktasını curl ile dener, sonucu durum/models_test.txt'ye yazar.
name: Models tanı
on:
  push:
    branches: [main]
    paths: ['.github/models-test']
permissions:
  contents: write
  models: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p durum; o=durum/models_test.txt; : > $o
          B='{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Sadece merhaba yaz"}],"max_tokens":20}'
          echo "== 1 models.github.ai -i" >> $o
          curl -sS -i -X POST https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $T" -H "Content-Type: application/json" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -d "$B" 2>&1 | head -c 1500 >> $o
          echo; echo "== 2 -L" >> $o
          curl -sS -L -X POST https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$B" 2>&1 | head -c 800 >> $o
          echo; echo "== 3 azure" >> $o
          curl -sS -i -X POST https://models.inference.ai.azure.com/chat/completions -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Sadece merhaba yaz"}],"max_tokens":20}' 2>&1 | head -c 1200 >> $o
          echo; echo "== 4 python" >> $o
          python3 -c "
          import urllib.request,json,os
          r=urllib.request.Request('https://models.github.ai/inference/chat/completions',json.dumps({'model':'openai/gpt-4.1-mini','messages':[{'role':'user','content':'merhaba yaz'}],'max_tokens':20}).encode(),{'Authorization':'Bearer '+os.environ['T'],'Content-Type':'application/json'},method='POST')
          x=urllib.request.urlopen(r); print(x.status, x.geturl(), dict(x.headers)); print(x.read()[:400])
          " >> $o 2>&1 || true
          git config user.name masal-bot; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $o; git commit -qm "Models tanı sonucu"; git push -q
